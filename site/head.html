<title>나인존 리포트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eef0f3; --shell:#ffffff; --side:#f7f8fa; --surface:#ffffff; --surface2:#f2f4f7;
  --ink:#171b21; --ink2:#4b5563; --muted:#8a919c; --grid:#edf0f3; --border:#e6e9ee; --hair:rgba(23,27,33,.08);
  --accent:#3b82f6; --accent-ink:#ffffff; --accent-soft:#eaf2fe;
  --gd:#16a34a; --gd-soft:#e8f7ee; --bd:#ef4444; --bd-soft:#fdecec;
  --pos:#e35150; --neg:#3b82f6; --div-mid:#eef0f2;
  --seq1:#d9e7fc; --seq7:#123f7d; --seq1o:#fbe3d6; --seq7o:#8a3210;
  --chip-bad:#fdecec; --chip-good:#eaf2fe;
  --sh:0 1px 2px rgba(23,27,33,.05),0 4px 14px rgba(23,27,33,.04);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --c0:#8a919c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e13; --shell:#12161d; --side:#161b23; --surface:#171d25; --surface2:#1f2630;
    --ink:#ecf0f4; --ink2:#b7c0ca; --muted:#79828d; --grid:#222a34; --border:#242d38; --hair:rgba(255,255,255,.08);
    --accent:#5b9cf1; --accent-ink:#0b0e13; --accent-soft:#1a2b44;
    --gd:#2ebd7f; --gd-soft:#15352a; --bd:#f47272; --bd-soft:#3a2224;
    --pos:#e66767; --neg:#5b9cf1; --div-mid:#2c3440;
    --seq1:#1a3355; --seq7:#a5c9f5; --seq1o:#3a2114; --seq7o:#f0b088;
    --chip-bad:#3a2224; --chip-good:#1a2b44;
    --sh:0 1px 2px rgba(0,0,0,.3);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e13; --shell:#12161d; --side:#161b23; --surface:#171d25; --surface2:#1f2630;
  --ink:#ecf0f4; --ink2:#b7c0ca; --muted:#79828d; --grid:#222a34; --border:#242d38; --hair:rgba(255,255,255,.08);
  --accent:#5b9cf1; --accent-ink:#0b0e13; --accent-soft:#1a2b44;
  --gd:#2ebd7f; --gd-soft:#15352a; --bd:#f47272; --bd-soft:#3a2224;
  --pos:#e66767; --neg:#5b9cf1; --div-mid:#2c3440;
  --seq1:#1a3355; --seq7:#a5c9f5; --seq1o:#3a2114; --seq7o:#f0b088;
  --chip-bad:#3a2224; --chip-good:#1a2b44;
  --sh:0 1px 2px rgba(0,0,0,.3);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Inter","IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13.5px;line-height:1.6;padding:26px 18px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{max-width:1320px;margin:0 auto;background:var(--shell);border-radius:24px;
  box-shadow:0 2px 6px rgba(23,27,33,.05),0 24px 60px rgba(23,27,33,.07);
  display:grid;grid-template-columns:252px minmax(0,1fr);overflow:hidden;min-height:calc(100vh - 52px)}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--grid)}}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--grid);padding:20px 14px 16px;
  display:flex;flex-direction:column;gap:14px;min-height:0}
.brand-row{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.25}
.brand-txt b{font-size:15px;font-weight:700;letter-spacing:-.2px}
.brand-txt span{font-size:8.5px;font-weight:600;letter-spacing:1.8px;color:var(--muted)}
.season-pill{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--ink2);box-shadow:var(--sh)}
.season-pill svg{color:var(--muted);flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:1.4px;color:var(--muted);
  text-transform:uppercase;padding:10px 8px 4px}
.nav button{display:flex;align-items:center;gap:9px;border:1px solid transparent;background:transparent;
  border-radius:10px;padding:8px 10px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer;text-align:left}
.nav button svg{color:var(--muted);flex:none}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--surface);border-color:var(--border);box-shadow:var(--sh);color:var(--ink);font-weight:600}
.nav button.on svg{color:var(--accent)}

/* player panel inside sidebar */
.player-panel{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.player-panel[hidden]{display:none}
.player-panel input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:99px;
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:12.5px;box-shadow:var(--sh)}
.player-panel input::placeholder{color:var(--muted)}
.team-chips{display:flex;flex-wrap:wrap;gap:3px;padding:0 2px}
.team-chips button{border:0;background:transparent;border-radius:99px;
  padding:2.5px 9px;font-size:11px;cursor:pointer;color:var(--muted);font-weight:500}
.team-chips button:hover{background:var(--surface2);color:var(--ink2)}
.team-chips button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sortrow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:0 2px}
.sortrow select{flex:1;padding:5px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:12px}
.plist{overflow-y:auto;flex:1;min-height:120px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh)}
.plist button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;
  background:transparent;padding:7.5px 12px;cursor:pointer;border-bottom:1px solid var(--grid);font-size:12.5px}
.plist button:last-child{border-bottom:0}
.plist button:hover{background:var(--surface2)}
.plist button.on{background:var(--accent-soft)}
.plist button.on .nm{color:var(--accent)}
.plist .nm{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .tm{font-size:10px;color:var(--muted);width:36px}
.plist .mv{font-size:11.5px;color:var(--ink2)}
.count-note{font-size:10.5px;color:var(--muted);padding:0 4px}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.main-top{display:flex;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.main-top h2{font-size:19px;font-weight:700;letter-spacing:-.3px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.date-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:10px;
  padding:7px 13px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--surface);box-shadow:var(--sh)}
.date-pill svg{color:var(--muted)}
.content{padding:22px 28px 10px;background:var(--shell)}
.report{display:flex;flex-direction:column;gap:16px;min-width:0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:var(--sh)}
.card h2{font-size:14.5px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px}
.card h2 .small-note{font-weight:400}
.card .cap{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.65}
.player-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.player-head .big{font-size:24px;font-weight:800;letter-spacing:-.5px}
.badge{display:inline-block;padding:2.5px 11px;border-radius:99px;font-size:11px;font-weight:600;
  background:var(--surface2);color:var(--ink2)}
.player-head .facts{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.55}

/* KPI tiles — one row, divided */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));margin-top:16px;
  border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}
.tile{padding:14px 16px;border-right:1px solid var(--grid)}
.tile:last-child{border-right:0}
.tile .lb{font-size:11px;color:var(--muted);font-weight:500}
.tile .v{font-size:23px;font-weight:700;letter-spacing:-.6px;line-height:1.3;margin-top:2px}
.tile .lg{font-size:10.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.tile .dl{font-weight:700;font-size:10.5px;display:inline-flex;align-items:center;gap:2px;border-radius:99px;padding:1px 7px}
.tile .dl.up{color:var(--gd);background:var(--gd-soft)}
.tile .dl.down{color:var(--bd);background:var(--bd-soft)}

.pct-rows{display:flex;flex-direction:column;gap:9px;max-width:620px}
.pct-row{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:12px;font-size:12px}
.pct-row .lb{color:var(--ink2);text-align:right}
.pct-track{position:relative;height:7px;border-radius:99px;background:var(--surface2)}
.pct-track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--grid)}
.pct-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.pct-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:24px;height:17px;border-radius:99px;z-index:1;
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 0 0 2.5px var(--surface)}
.pct-row .rv{color:var(--ink2);text-align:right;font-weight:600}

table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{font-size:11px;color:var(--muted);font-weight:500;
  text-align:right;padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{padding:8px 9px;border-bottom:1px solid var(--grid);text-align:right}
table.tb tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.ptype{display:flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.dotc{width:8px;height:8px;border-radius:50%;flex:none}
.ubar{position:relative;height:5px;border-radius:99px;background:var(--surface2);width:64px;display:inline-block;vertical-align:middle;margin-left:8px}
.ubar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.good{color:var(--pos);font-weight:700}.bad{color:var(--neg);font-weight:700}

/* zone heatmaps */
.zone-flex{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
.zwrap{display:flex;flex-direction:column;gap:8px;align-items:center}
.zgrid{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,56px);gap:4px;
  padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--sh)}
.zgrid.mini{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,31px);padding:7px;gap:3px;border-radius:10px}
.zcell{border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;cursor:default;position:relative}
.zgrid.mini .zcell{font-size:9.5px;font-weight:500;border-radius:5px}
.zcap{font-size:12px;color:var(--ink2);font-weight:600}
.zsub{font-size:10.5px;color:var(--muted)}
.metric-tabs{display:inline-flex;gap:2px;flex-wrap:wrap;margin-bottom:16px;background:var(--surface2);border-radius:99px;padding:3px}
.metric-tabs button{border:0;background:transparent;border-radius:99px;
  padding:5.5px 14px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:500}
.metric-tabs button:hover{color:var(--ink2)}
.metric-tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
.legend-bar{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);margin-top:4px}
.legend-grad{width:110px;height:7px;border-radius:99px;border:1px solid var(--hair)}
.oz-note{font-size:12px;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:10px 14px;margin-top:8px;display:inline-block;line-height:1.7}

.split-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.split-box{background:var(--surface2);border-radius:12px;padding:12px 16px}
.split-box .t{font-size:11px;font-weight:600;color:var(--muted)}
.split-box .r{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--grid)}
.split-box .r:last-child{border-bottom:0}

.sw-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media (max-width:760px){.sw-grid{grid-template-columns:1fr}}
.sw-col h3{font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sw-col.strength h3{color:var(--gd)}
.sw-col.weak h3{color:var(--bd)}
.sw-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.sw-col li{padding:10px 14px;font-size:12.5px;line-height:1.6;background:var(--surface2);border-radius:12px}
.sw-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;border-radius:99px;padding:1.5px 9px;margin-right:8px;vertical-align:1px}
.strength .sw-tag{background:var(--gd-soft);color:var(--gd)}
.weak .sw-tag{background:var(--bd-soft);color:var(--bd)}

.gloss{columns:2;column-gap:34px;font-size:12px;color:var(--ink2)}
@media (max-width:760px){.gloss{columns:1}}
.gloss p{break-inside:avoid;margin:0 0 11px}
.gloss b{color:var(--ink)}

.pat-h{font-size:12.5px;font-weight:700;color:var(--ink);margin:0 0 8px}

/* league analysis */
.sub-toggle{display:inline-flex;gap:2px;background:var(--surface2);border-radius:99px;padding:3px;margin-left:14px;vertical-align:middle}
.sub-toggle button{border:0;background:transparent;color:var(--muted);padding:5.5px 18px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
.sub-toggle button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--sh)}
.lead-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.lead-card{background:var(--surface2);border-radius:14px;padding:14px 16px}
.lead-card .mt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.lead-card .mt b{font-size:13px;font-weight:700}
.lead-card .mt span{font-size:10.5px;color:var(--muted)}
.lead-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.lead-col h4{margin:0 0 5px;font-size:10.5px;font-weight:700}
.lead-col.hi h4{color:var(--gd)}.lead-col.lo h4{color:var(--bd)}
.lead-row{display:grid;grid-template-columns:13px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:12px;padding:2.5px 4px;cursor:pointer;border-radius:6px}
.lead-row:hover{background:var(--surface)}
.lead-row .rk{color:var(--muted);font-size:10px}
.lead-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.lead-row .nm em{font-style:normal;color:var(--muted);font-size:10px;margin-left:4px}
.lead-row .vl{font-weight:600}
table.tb.sortable th{cursor:pointer;user-select:none}
table.tb.sortable th.on{color:var(--accent);font-weight:700}
table.tb tr.clk{cursor:pointer}
table.tb tr.clk:hover td{background:var(--surface2)}
td.heat{font-weight:600}
.rank-note{font-size:11px;color:var(--muted);margin-top:14px;font-weight:600}

/* matchup */
.vs-row{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start}
@media (max-width:760px){.vs-row{grid-template-columns:1fr}}
.vs-side{display:flex;flex-direction:column;gap:8px}
.vs-side label{font-size:10.5px;font-weight:600;color:var(--muted)}
.vs-side select{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;box-shadow:var(--sh)}
.vs-side .selrow{display:flex;gap:6px}
.vs-side .selrow select:first-child{width:96px;flex:none}
.vs-side .selrow select:last-child{flex:1;min-width:0}
.vs-mark{font-weight:800;font-size:15px;color:var(--muted);text-align:center;padding:36px 4px 0;letter-spacing:1px}
.vs-name{font-size:15px;font-weight:700}
.vs-name em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--muted);margin-left:6px}
.h2h-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));margin-top:8px;
  border:1px solid var(--border);border-radius:14px;overflow:hidden}
.h2h-strip .cell{padding:11px 14px;border-right:1px solid var(--grid)}
.h2h-strip .cell:last-child{border-right:0}
.h2h-strip .cell .l{font-size:10px;color:var(--muted);font-weight:500}
.h2h-strip .cell .v{font-size:19px;font-weight:700;letter-spacing:-.4px}
.edge-chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:10.5px;font-weight:700;white-space:nowrap}
.edge-p{background:var(--chip-bad);color:var(--pos)}
.edge-b{background:var(--chip-good);color:var(--neg)}
.edge-n{background:var(--surface2);color:var(--muted)}
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media (max-width:760px){.strat-grid{grid-template-columns:1fr}}
.strat-col h3{font-size:12.5px;font-weight:700;margin-bottom:10px}
.strat-col ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.strat-col li{background:var(--surface2);border-radius:12px;padding:10px 14px 10px 38px;font-size:12.5px;line-height:1.6;position:relative;counter-increment:st}
.strat-col li::before{content:counter(st);position:absolute;left:12px;top:11px;width:17px;height:17px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.strat-col.bat li::before{background:var(--muted)}
.zone-pair{display:flex;gap:40px;flex-wrap:wrap}
.small-note{font-size:11px;color:var(--muted)}

/* team badges (brand-color monograms) */
.tbadge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  font-weight:800;flex:none;letter-spacing:-.3px;line-height:1;
  box-shadow:0 0 0 1px var(--hair);vertical-align:-3px;font-family:"Inter","IBM Plex Sans KR",sans-serif}
.badge.team{display:inline-flex;align-items:center;gap:7px;padding:2.5px 12px 2.5px 5px}
.tdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.tlogo{border-radius:50%;background:#fff;object-fit:contain;padding:1.5px;flex:none;
  box-shadow:0 0 0 1px var(--hair);vertical-align:-5px}
.tcell{display:inline-flex;align-items:center;gap:7px}
.lead-row .nm .tbadge{margin-right:2px}
.plist .tm{width:auto;display:flex;align-items:center}

#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--shell);
  border-radius:10px;padding:8px 12px;font-size:11.5px;line-height:1.55;max-width:240px;
  opacity:0;transition:opacity .08s;white-space:pre-line;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.footer-note{padding:20px 2px 26px;font-size:11px;color:var(--muted);line-height:1.7}
</style>
