<div class="shell">
  <aside class="side">

      <div class="brand-txt"><b>나인존</b><span>NINEZONE REPORT</span></div>

    <div class="season-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/></svg><span>2026 KBO 정규시즌</span></div>

      <button id="tabP" class="on" role="tab"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5"/></svg>투수 리포트</button>
      <button id="tabB" role="tab"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l7-7M9 15L19.5 4.5M17 2l5 5-2.5 2.5-5-5z"/></svg>타자 리포트</button>
      <span class="nav-label">리그</span>
      <button id="tabL" role="tab"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>리그 분석</button>
      <span class="nav-label">시뮬레이션</span>

      <input id="search" type="search" placeholder="선수 검색…" aria-label="선수 검색">
      <div class="team-chips" id="teamChips"></div>

      <div class="plist" id="plist"></div>
      <div class="count-note" id="countNote"></div>

  <main class="main">

      <h2 id="pageTitle">투수 리포트</h2>
      <div class="top-right"><span class="date-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/></svg><span id="metaLine"></span></span></div>
    </div>
    <div class="content">
      <div class="report" id="report"></div>
      <div class="footer-note">
        존 구획은 포수 시점(그리드 왼쪽 = 3루측) 기준이며, 각 투구의 상·하한 스트라이크 존(topSz/bottomSz)을 3×3 등분해 판정했습니다.
        wOBA 가중치와 카운트별 기대득점은 일반적인 세이버메트릭스 근사값을 사용한 추정치입니다.
        표본이 작은 셀(표시 기준 미달)은 회색으로 처리됩니다. 데이터: 나인존 수집 KBO 트래킹 데이터.
      </div>
    </div>
  </main>
